<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffd166">
<title>진표의 국어 대결</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{--ink:#2c2350;--gold:#ffc93c;--red:#ff6b6b;--blue:#4dabf7;--green:#51cf66;--paper:#fffdf5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:#2c2350}
#app{position:fixed;inset:0;width:100vw;height:100dvh;font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);overflow:hidden}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.scr.on{display:flex}
.jua{font-family:'Jua','Apple SD Gothic Neo',sans-serif}
button{font-family:'Jua','Apple SD Gothic Neo',sans-serif;cursor:pointer;border:0;color:var(--ink);-webkit-tap-highlight-color:transparent}
.btn{background:var(--gold);border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:14px 30px;font-size:min(32px,5.4vh);transition:transform .07s,box-shadow .07s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.g{background:var(--green)}.btn.b{background:var(--blue);color:#fff}.btn.w{background:#fff}

/* ---------- 시작 화면 ---------- */
#title{background:linear-gradient(#ffe29a,#ffb86c 60%,#ff9a76)}
#title .deco{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.logo{font-family:'Jua';font-size:min(74px,11vh,13vw);line-height:1.08;color:#fff;text-align:center;
 text-shadow:0 5px 0 var(--ink),4px 0 0 var(--ink),-4px 0 0 var(--ink),0 -4px 0 var(--ink),5px 8px 0 rgba(44,35,80,.25)}
.sublogo{font-family:'Jua';font-size:min(26px,4.4vh);background:#fff;border:4px solid var(--ink);border-radius:999px;padding:6px 22px;margin-top:14px;box-shadow:0 5px 0 var(--ink)}
.heroes{display:flex;gap:min(30px,5vw);align-items:flex-end;margin:min(26px,3.4vh) 0}
.hero{width:min(130px,20vw);height:min(130px,20vw);border-radius:50%;border:5px solid var(--ink);background:#fff;box-shadow:0 6px 0 var(--ink);overflow:hidden;display:grid;place-items:center;font-size:min(72px,11vw)}
.hero img{width:100%;height:100%;object-fit:cover}
.vs{font-family:'Jua';font-size:min(46px,7vw);color:#fff;text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink);align-self:center}

/* ---------- 지도 ---------- */
#map{background:linear-gradient(#a0e7ff,#d8f6ff);gap:min(14px,2vh);padding:min(18px,3vh) 12px;justify-content:flex-start;overflow-y:auto}
#map h2{font-family:'Jua';font-size:min(40px,6.6vh);color:#fff;text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink);margin-top:min(10px,1.6vh)}
.stars{font-family:'Jua';font-size:min(26px,4.2vh);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px 18px;box-shadow:0 4px 0 var(--ink)}
.cards{display:flex;flex-wrap:wrap;gap:min(14px,2.2vh);justify-content:center;max-width:980px;padding:6px 0 18px}
.wcard{width:min(170px,27vw);min-width:132px;border:4px solid var(--ink);border-radius:24px;background:#fff;box-shadow:0 6px 0 var(--ink);
 padding:min(14px,2vh) 8px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .1s}
.wcard:active{transform:translateY(4px)}
.wcard .em{font-size:min(50px,7.4vh)}
.wcard .nm{font-family:'Jua';font-size:min(24px,3.6vh);word-break:keep-all;text-align:center}
.wcard .sb{font-size:min(15px,2.4vh);opacity:.7}
.wcard .cr{font-size:min(24px,3.6vh);min-height:1.2em}
.wcard.lock{filter:grayscale(.85);opacity:.65}
.backbtn{position:absolute;left:12px;top:12px;z-index:5}

/* ---------- 게임 ---------- */
#game{background:#cfe9ff;justify-content:flex-start}
#bd{position:absolute;inset:0;width:100%;height:100%;display:block}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 10px 8px;z-index:3}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.95);border:3px solid var(--ink);border-radius:999px;
 padding:3px 14px;font-family:'Jua';font-size:min(24px,4.2vh);box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.icobtn{width:min(46px,7.4vh);height:min(46px,7.4vh);border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);
 display:grid;place-items:center;font-size:min(23px,3.8vh);flex:0 0 auto}
.sp{flex:1}
.bot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:10px;
 padding:10px 10px max(10px,env(safe-area-inset-bottom));z-index:3;flex-wrap:wrap}
#turnMsg{font-family:'Jua';font-size:min(27px,4.6vh);background:rgba(255,255,255,.96);border:4px solid var(--ink);border-radius:999px;
 padding:6px 24px;box-shadow:0 5px 0 var(--ink);text-align:center;word-break:keep-all}
.items{position:absolute;right:10px;bottom:max(70px,calc(env(safe-area-inset-bottom) + 66px));display:flex;flex-direction:column;gap:8px;z-index:3}
.item{width:min(54px,8.6vh);height:min(54px,8.6vh);border-radius:16px;background:#fff;border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);
 display:grid;place-items:center;font-size:min(28px,4.6vh);animation:pop .35s}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}

/* ---------- 문제 카드 ---------- */
#quiz{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,16,45,.55);z-index:10;padding:10px}
#quiz.on{display:flex}
.card{width:min(760px,96vw);max-height:96dvh;overflow-y:auto;background:var(--paper);border:5px solid var(--ink);border-radius:28px;
 box-shadow:0 10px 0 var(--ink);padding:min(20px,2.6vh) min(22px,4vw);display:flex;flex-direction:column;align-items:center;gap:min(14px,1.8vh);
 animation:cardin .28s cubic-bezier(.2,1.5,.5,1)}
@keyframes cardin{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.card.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:none}20%{transform:translateX(-12px) rotate(-2deg)}40%{transform:translateX(12px) rotate(2deg)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.qtop{width:100%;display:flex;align-items:center;gap:8px}
.qwho{font-family:'Jua';font-size:min(23px,3.6vh,5.2vw);background:var(--blue);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px 14px;white-space:nowrap}
.qtag{font-size:min(16px,2.6vh,3.4vw);opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.speak{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:5px 14px;font-size:min(21px,3.4vh,4.6vw);box-shadow:0 3px 0 var(--ink);white-space:nowrap;flex:0 0 auto}
.qbig{font-family:'Jua';font-size:min(70px,9vh);text-align:center;line-height:1.15;word-break:keep-all}
.qbig.long{font-family:'Gowun Dodum';font-size:min(26px,3.6vh);line-height:1.55;text-align:left;background:#fff;border:3px dashed #bbb;
 border-radius:16px;padding:12px 14px;width:100%}
.qtext{font-family:'Jua';font-size:min(38px,5.2vh);text-align:center;line-height:1.3;word-break:keep-all}
.chs{width:100%;display:flex;flex-direction:column;gap:min(11px,1.6vh)}
.ch{width:100%;background:#fff;border:4px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:min(14px,1.9vh) 14px;
 font-size:min(34px,4.8vh);word-break:keep-all;line-height:1.25;transition:transform .07s,box-shadow .07s}
.ch:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.ch.ok{background:var(--green);animation:okp .5s}
.ch.no{background:var(--red);color:#fff}
.ch.dim{opacity:.25;pointer-events:none}
@keyframes okp{0%,100%{transform:none}30%{transform:scale(1.07)}}
.fb{font-family:'Jua';font-size:min(38px,5.2vh);text-align:center}
.fb.ok{color:#2b9348}.fb.no{color:#d62828}
.hintbox{background:#fff5d6;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;font-size:min(24px,3.4vh);
 text-align:center;line-height:1.4;word-break:keep-all;width:100%}
.useitem{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 18px;font-size:min(22px,3.4vh);box-shadow:0 3px 0 var(--ink)}

/* ---------- 결과 ---------- */
#res{background:rgba(20,16,45,.75);z-index:12;padding:12px}
.rcard{width:min(620px,94vw);max-height:94dvh;overflow-y:auto;background:var(--paper);border:5px solid var(--ink);border-radius:30px;
 box-shadow:0 10px 0 var(--ink);padding:min(24px,3vh) 20px;display:flex;flex-direction:column;align-items:center;gap:min(12px,1.8vh);text-align:center}
.rt{font-family:'Jua';font-size:min(52px,7.4vh);line-height:1.1}
.rline{font-size:min(24px,3.6vh)}
.wrongList{width:100%;text-align:left;display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow-y:auto}
.wrongItem{background:#fff;border:3px solid #ddd;border-radius:14px;padding:8px 12px;font-size:min(19px,2.9vh);line-height:1.4;word-break:keep-all}
.wrongItem b{color:#2b9348}
#portrait{position:fixed;inset:0;background:#2c2350;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;
 gap:16px;z-index:99;font-family:'Jua';font-size:min(30px,5vw);text-align:center;padding:20px}
.toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:'Jua';font-size:min(46px,7vh);color:#fff;
 text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink);z-index:6;pointer-events:none;
 animation:tin .9s ease-out forwards;white-space:nowrap}
@keyframes tin{0%{transform:translateX(-50%) scale(.4);opacity:0}25%{transform:translateX(-50%) scale(1.15);opacity:1}75%{opacity:1}100%{transform:translateX(-50%) translateY(-40px) scale(1);opacity:0}}
</style>
</head>
<body>
<div id="app">

<div class="scr on" id="title">
  <div class="deco" id="tdeco"></div>
  <div class="logo jua">진표의<br>국어 대결</div>
  <div class="heroes">
    <div class="hero" id="heroMe"></div>
    <div class="vs">VS</div>
    <div class="hero" id="heroFoe">👺</div>
  </div>
  <div class="sublogo">말썽이를 이기고 국어 왕이 되자!</div>
  <div style="display:flex;gap:12px;margin-top:min(22px,3vh);align-items:center">
    <button class="btn" id="startBtn">🎲 시작하기</button>
    <button class="icobtn" id="sndBtn" style="width:min(56px,9vh);height:min(56px,9vh);font-size:min(28px,4.6vh)">🔊</button>
  </div>
</div>

<div class="scr" id="map">
  <button class="btn w backbtn" id="mapBack" style="padding:8px 16px;font-size:min(22px,3.6vh)">◀</button>
  <h2 class="jua">어느 나라로 갈까?</h2>
  <div class="stars jua" id="mapStars">⭐ 0</div>
  <div class="cards" id="cards"></div>
</div>

<div class="scr" id="game">
  <canvas id="bd"></canvas>
  <div class="top">
    <button class="icobtn" id="homeBtn">🏠</button>
    <div class="chip" id="stgChip">🏡 한글 마을</div>
    <div class="sp"></div>
    <div class="chip" id="starChip">⭐ 0</div>
    <button class="icobtn" id="sndBtn2">🔊</button>
  </div>
  <div class="items" id="itemBox"></div>
  <div class="bot"><div id="turnMsg" class="jua">준비!</div></div>
</div>

<div id="quiz">
  <div class="card" id="qcard">
    <div class="qtop">
      <span class="qwho jua" id="qWho">진표 차례</span>
      <span class="qtag" id="qTag"></span>
      <span class="sp" style="flex:1"></span>
      <button class="speak" id="qSpeak">🔊 다시 듣기</button>
    </div>
    <div class="qbig jua" id="qBig"></div>
    <div class="qtext jua" id="qText"></div>
    <div class="chs" id="qChs"></div>
    <div id="qAfter"></div>
  </div>
</div>

<div class="scr" id="res">
  <div class="rcard">
    <div class="rt jua" id="resTitle"></div>
    <div style="font-size:min(80px,11vh)" id="resEmo"></div>
    <div class="rline jua" id="resLine"></div>
    <div class="rline" id="resStat"></div>
    <div class="wrongList" id="resWrong"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px">
      <button class="btn g" id="againBtn">다시 대결</button>
      <button class="btn w" id="toMapBtn">지도로</button>
    </div>
  </div>
</div>

</div>
<script>
/* ===================== 국어 문제 데이터 ===================== */
const JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
const CHO = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
const JUNG = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ'];
const hcode = ch => ch.charCodeAt(0) - 0xac00;
const isHan = ch => hcode(ch) >= 0 && hcode(ch) < 11172;
const jongOf = ch => isHan(ch) ? JONG[hcode(ch) % 28] : '';
const choOf = ch => isHan(ch) ? CHO[Math.floor(hcode(ch) / 588)] : '';
const jungOf = ch => isHan(ch) ? JUNG[Math.floor((hcode(ch) % 588) / 28)] : '';
const hasJong = ch => isHan(ch) && hcode(ch) % 28 > 0;
const mkHan = (c, j, t) => String.fromCharCode(0xac00 + c * 588 + j * 28 + t);

/* 그림 낱말 */
const PIC = [['🍎', '사과'], ['🍌', '바나나'], ['🍇', '포도'], ['🍓', '딸기'], ['🍉', '수박'], ['🥕', '당근'], ['🌽', '옥수수'], ['🍅', '토마토'], ['🥔', '감자'], ['🍠', '고구마'],
['🐶', '강아지'], ['🐱', '고양이'], ['🐰', '토끼'], ['🐯', '호랑이'], ['🐘', '코끼리'], ['🦁', '사자'], ['🐻', '곰'], ['🐸', '개구리'], ['🐟', '물고기'], ['🦋', '나비'],
['🐝', '꿀벌'], ['🐢', '거북이'], ['🐷', '돼지'], ['🐮', '소'], ['🐔', '닭'], ['🦆', '오리'], ['🐭', '쥐'], ['🐍', '뱀'], ['🐜', '개미'], ['🐧', '펭귄'],
['🚗', '자동차'], ['🚌', '버스'], ['🚕', '택시'], ['✈️', '비행기'], ['🚂', '기차'], ['🚲', '자전거'], ['🚁', '헬리콥터'], ['🚢', '배'], ['🚒', '소방차'], ['🚑', '구급차'],
['🏠', '집'], ['🏫', '학교'], ['🌳', '나무'], ['🌸', '꽃'], ['☀️', '해'], ['🌙', '달'], ['⭐', '별'], ['☁️', '구름'], ['⛄', '눈사람'], ['☂️', '우산'],
['👟', '신발'], ['🎒', '가방'], ['✏️', '연필'], ['📚', '책'], ['🕐', '시계'], ['🪑', '의자'], ['🛏️', '침대'], ['🚪', '문'], ['🪟', '창문'], ['🧹', '빗자루'],
['🍚', '밥'], ['🍜', '국수'], ['🍞', '빵'], ['🥛', '우유'], ['🍪', '과자'], ['🎂', '케이크'], ['🍦', '아이스크림'], ['🥚', '달걀'], ['🧀', '치즈'], ['🍗', '닭다리'],
['🖐️', '손'], ['🦶', '발'], ['👁️', '눈'], ['👂', '귀'], ['👃', '코'], ['👄', '입'], ['🦷', '이'], ['🧠', '머리'], ['🫀', '심장'], ['💧', '물']];

/* 받침 있는 낱말 (받침 찾기용) */
const BWORDS = ['꽃', '밥', '산', '물', '공', '눈', '달', '별', '집', '책', '손', '발', '곰', '밤', '옷', '문', '콩', '떡', '강', '빵', '벌', '말', '불', '숲', '창', '종', '섬', '줄', '눈', '봄', '잠', '삽', '컵', '곧', '낮', '빗', '칼', '길', '논', '끈'];
/* 받침 없는 낱말 */
const NOB = ['바다', '나무', '구두', '모자', '사과', '나비', '어머니', '다리', '포도', '가위', '기차', '노래', '허리', '이마', '토끼', '오리', '두부', '바지', '주머니', '거미'];

/* 첫소리 같은 낱말 묶음 */
const SOUNDW = [['강아지', '멍멍'], ['고양이', '야옹'], ['병아리', '삐약삐약'], ['소', '음매'], ['돼지', '꿀꿀'], ['개구리', '개굴개굴'], ['참새', '짹짹'], ['오리', '꽥꽥'], ['수탉', '꼬끼오'], ['벌', '붕붕'], ['시계', '똑딱똑딱'], ['천둥', '우르릉'], ['기차', '칙칙폭폭'], ['북', '둥둥'], ['바람', '씽씽'], ['빗물', '주룩주룩'], ['아기', '응애응애'], ['염소', '메에']];

/* 흉내 내는 말 (의태어) */

function hopTo(p, tile) {
  return new Promise(res => {
    const t0 = tiles[clamp(p.tile, 0, N - 1)], t1 = tiles[clamp(tile, 0, N - 1)];
    const sx = t0.x + p.dx * TR * .55, sy = t0.y + p.dy * TR * .55;
    const ex = t1.x + p.dx * TR * .55, ey = t1.y + p.dy * TR * .55;
    const dur = 250, st = performance.now(); SFX.hop();
    const step = () => {
      const k = clamp((performance.now() - st) / dur, 0, 1);
      p.x = sx + (ex - sx) * k; p.y = sy + (ey - sy) * k; p.hop = Math.sin(k * Math.PI) * TR * 1.1;
      if (k < 1) requestAnimationFrame(step); else { p.hop = 0; p.tile = tile; posPiece(p); res(); }
    };
    step();
  });
}
async function movePiece(p, steps) {
  const dir = steps > 0 ? 1 : -1;
  for (let i = 0; i < Math.abs(steps); i++) {
    const nt = clamp(p.tile + dir, 0, N - 1);
    if (nt === p.tile) break;
    await hopTo(p, nt);
    if (p.tile >= N - 1) break;
  }
}

/* ---------- 주사위 ---------- */
function rollDice(gold) {
  return new Promise(res => {
    const val = gold ? 6 : 1 + rnd(4);
    dice = { n: 1 + rnd(4), rot: 0, sc: 0, gold: !!gold };
    const st = performance.now(), dur = 1000; SFX.roll();
    let stop = false;
    const tap = () => { stop = true; };
    cv.addEventListener('pointerdown', tap, { once: true });
    const step = () => {
      const el = performance.now() - st, k = clamp(el / dur, 0, 1);
      dice.sc = k < .2 ? k / .2 : 1 + Math.sin(k * 12) * .05 * (1 - k);
      dice.rot = (1 - k) * 12 * Math.sin(el / 90);
      if (el % 90 < 18) dice.n = 1 + rnd(gold ? 6 : 4);
      if (k < 1 && !(stop && el > 350)) requestAnimationFrame(step);
      else {
        dice.n = val; dice.rot = 0; dice.sc = 1.15; SFX.diceStop();
        cv.removeEventListener('pointerdown', tap);
        setTimeout(() => { dice.sc = 1; setTimeout(() => { dice = null; res(val); }, 480); }, 120);
      }
    };
    step();
  });
}

/* ---------- 아이템 ---------- */
function addItem(k) {
  if (items.length >= 3) items.shift();
  items.push(k); drawItems(); SFX.power();
  toast(ITEM_INFO[k][0] + ' ' + ITEM_INFO[k][1] + ' 얻었다!', '#ffd43b');
}
function useItem(k) { const i = items.indexOf(k); if (i < 0) return false; items.splice(i, 1); drawItems(); return true; }
function drawItems() { $('itemBox').innerHTML = items.map(k => '<div class="item" title="' + ITEM_INFO[k][1] + '">' + ITEM_INFO[k][0] + '</div>').join(''); }

/* ---------- 칸 효과 ---------- */
async function tileEffect(p) {
  const ty = board[p.tile];
  const other = p === me ? foe : me;
  if (ty === 'star') {
    if (p === me) { stat.got += 5; updStars(); }
    floatTxt(p.x, p.y - TR, '⭐+5', '#ffd43b'); burst(p.x, p.y, 14, ['#ffd43b', '#fff3bf'], '⭐'); SFX.star(3);
    toast('별 5개 획득!', '#ffd43b'); await wait(700);
  } else if (ty === 'boost') {
    SFX.whoosh(); toast('🚀 로켓! 2칸 앞으로!', '#69db7c'); await wait(500); await movePiece(p, 2);
  } else if (ty === 'slip') {
    if (p === me && useItem('shield')) { toast('🛡️ 방패가 막았다!', '#4dabf7'); SFX.shield(); await wait(700); }
    else { SFX.slip(); toast('🌀 미끄럼! 2칸 뒤로!', '#ff8787'); await wait(500); await movePiece(p, -2); }
  } else if (ty === 'gift') {
    if (p === me) addItem(['dice', 'shield', 'hint'][rnd(3)]);
    else { toast('말썽이가 선물을 가져갔다!', '#da77f2'); SFX.box(); }
    await wait(700);
  } else if (ty === 'bolt') {
    if (other === me && useItem('shield')) { toast('🛡️ 방패가 막았다!', '#4dabf7'); SFX.shield(); await wait(700); }
    else { SFX.bolt(); toast('⚡ 번개! ' + (other === me ? '진표' : '말썽이') + ' 2칸 뒤로!', '#4dabf7'); await wait(500); await movePiece(other, -2); }
  } else if (ty === 'again') {
    SFX.power(); toast('🍀 한 번 더!', '#63e6be'); extraTurn = true; await wait(700);
  }
}

/* ---------- 문제 ---------- */
function updStars() { $('starChip').textContent = '⭐ ' + stat.got; }
function openQuiz() {
  return new Promise(res => {
    const q = makeQ(si); curQ = q; quizOpen = true; stat.q++;
    $('qWho').textContent = '진표 차례';
    $('qTag').textContent = q.tag;
    $('qBig').textContent = q.big || '';
    $('qBig').className = 'qbig jua' + (q.long ? ' long' : '');
    $('qBig').style.display = q.big ? '' : 'none';
    $('qText').textContent = q.q;
    $('qAfter').innerHTML = '';
    const chs = $('qChs'); chs.innerHTML = '';
    q.choices.forEach((c, i) => {
      const b = document.createElement('button'); b.className = 'ch jua'; b.textContent = c;
      b.onclick = () => answer(i, b, res); chs.appendChild(b);
    });
    if (items.includes('hint')) {
      const hb = document.createElement('button'); hb.className = 'useitem jua'; hb.textContent = '💡 힌트 쓰기 (보기 하나 지우기)';
      hb.onclick = () => { if (!useItem('hint')) return; hb.remove(); SFX.ding(4); const bad = [...chs.children].filter((_, i) => i !== q.ans); bad[rnd(bad.length)].classList.add('dim'); };
      $('qAfter').appendChild(hb);
    }
    $('qcard').classList.remove('shake');
    $('quiz').classList.add('on'); SFX.card();
    setTimeout(() => say(q.say), 260);
  });
}
function answer(i, btn, res) {
  const q = curQ; if (!quizOpen) return; quizOpen = false;
  const chs = [...$('qChs').children];
  chs.forEach(b => b.onclick = null);
  if (i === q.ans) {
    btn.classList.add('ok'); SFX.right(); speechSynthesis.cancel();
    stat.ok++; stat.streak++; stat.best = Math.max(stat.best, stat.streak);
    let gain = 3; if (stat.streak >= 3) gain += 2;
    stat.got += gain; updStars();
    const fb = document.createElement('div'); fb.className = 'fb ok jua';
    fb.textContent = '딩동댕! ⭐+' + gain + (stat.streak >= 3 ? '  🔥' + stat.streak + '연속!' : '');
    $('qAfter').innerHTML = ''; $('qAfter').appendChild(fb);
    setTimeout(() => { $('quiz').classList.remove('on'); res(true); }, 850);
  } else {
    btn.classList.add('no'); chs[q.ans].classList.add('ok'); SFX.wrong();
    stat.streak = 0; missed.push(q);
    $('qcard').classList.add('shake');
    const box = document.createElement('div');
    box.innerHTML = '<div class="fb no jua">땡! 정답은 "' + esc(q.answer) + '"</div>' + (q.hint ? '<div class="hintbox">' + esc(q.hint) + '</div>' : '');
    const ok = document.createElement('button'); ok.className = 'btn g jua'; ok.style.marginTop = '10px'; ok.textContent = '알았어요!';
    ok.onclick = () => { speechSynthesis.cancel(); $('quiz').classList.remove('on'); res(false); };
    $('qAfter').innerHTML = ''; $('qAfter').appendChild(box); $('qAfter').appendChild(ok);
    setTimeout(() => say('정답은 ' + q.answer + ' 예요. ' + (q.hint || '')), 700);
  }
}
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* ---------- 턴 ---------- */
function msg(t) { $('turnMsg').textContent = t; }
async function myTurn() {
  msg('진표 차례! 문제를 풀어요');
  await wait(450);
  const ok = await openQuiz();
  let n;
  if (ok) {
    const gold = useItem('dice');
    if (gold) { toast('🎲 황금 주사위!', '#ffd43b'); await wait(400); }
    msg('주사위를 굴려요!');
    n = await rollDice(gold);
    toast(n + '칸 앞으로!', '#fff');
  } else {
    msg('아쉬워요! 한 칸만 가요');
    n = 1; await wait(600);
  }
  await movePiece(me, n);
  if (me.tile >= N - 1) return;
  await tileEffect(me);
}
async function foeTurn() {
  msg('말썽이 차례...');
  SFX.think(); await wait(900);
  const ok = Math.random() < STAGES[si].acc;
  if (ok) { toast('말썽이 정답! 😈', '#ff8787'); SFX.foeOk(); }
  else { toast('말썽이 오답! 😵', '#69db7c'); SFX.foeNo(); }
  await wait(700);
  const n = ok ? await rollDice(false) : 1;
  if (!ok) { msg('말썽이는 한 칸만!'); await wait(400); }
  await movePiece(foe, n);
  if (foe.tile >= N - 1) return;
  await tileEffect(foe);
}
async function loop(myGen) {
  while (!gameOver && myGen === gen) {
    extraTurn = false;
    if (turn === 'me') { await myTurn(); if (myGen !== gen) return; if (me.tile >= N - 1) return finish(true, myGen); }
    else { await foeTurn(); if (myGen !== gen) return; if (foe.tile >= N - 1) return finish(false, myGen); }
    if (!extraTurn) turn = turn === 'me' ? 'foe' : 'me';
    else { toast('한 번 더!', '#63e6be'); await wait(500); }
    await wait(250);
  }
}
async function finish(won, myGen) {
  if (myGen !== undefined && myGen !== gen) return;
  gameOver = true; msg(won ? '진표 승리!' : '말썽이 승리…');
  const p = won ? me : foe;
  if (won) {
    SFX.win(); stat.got += 20;
    for (let i = 0; i < 5; i++) { burst(W * (.2 + Math.random() * .6), H * (.2 + Math.random() * .4), 22, ['#ffd43b', '#ff6b6b', '#4dabf7', '#69db7c'], '🎉'); await wait(180); }
    say('진표가 이겼어요! 정말 잘했어요!');
  } else { SFX.lose(); burst(p.x, p.y, 16, ['#868e96'], '😈'); say('아쉬워요. 다시 도전해요!'); }
  SAVE.stars += stat.got;
  if (won) { SAVE.win[si] = 1; if (SAVE.un < si + 2) SAVE.un = Math.min(5, si + 2); }
  saveNow();
  await wait(won ? 900 : 700);
  if (myGen !== undefined && myGen !== gen) return;
  showResult(won);
}
function showResult(won) {
  $('resTitle').textContent = won ? '진표 승리! 🎉' : '아깝다!';
  $('resEmo').textContent = won ? '👑' : '😤';
  $('resLine').textContent = won ? STAGES[si].name + ' 정복!' : '말썽이가 먼저 도착했어요';
  $('resStat').innerHTML = '맞힌 문제 <b>' + stat.ok + '</b> / ' + stat.q + '개 &nbsp;·&nbsp; 최고 연속 <b>' + stat.best + '</b>번<br>이번에 모은 별 <b>⭐' + stat.got + '</b>';
  const wl = $('resWrong');
  if (missed.length) {
    wl.innerHTML = '<div class="jua" style="font-size:min(22px,3.4vh);margin:6px 0 2px">📕 다시 보기</div>' +
      missed.slice(0, 6).map(q => '<div class="wrongItem">' + (q.big && !q.long ? '<b style="color:#2c2350">' + esc(q.big) + '</b> — ' : '') + esc(q.q) + '<br>→ <b>' + esc(q.answer) + '</b>' + (q.hint ? '<br><span style="opacity:.7">' + esc(q.hint) + '</span>' : '') + '</div>').join('');
  } else wl.innerHTML = '<div class="wrongItem" style="text-align:center">틀린 문제가 하나도 없어요! 👏</div>';
  $('res').classList.add('on');
}

/* ---------- 시작 ---------- */
function startStage(i) {
  gen++; speechSynthesis.cancel(); quizOpen = false; $('quiz').classList.remove('on'); $('res').classList.remove('on');
  si = i; board = makeBoard(); items = []; missed = []; parts = []; dice = null;
  stat = { q: 0, ok: 0, streak: 0, best: 0, got: 0 };
  me = { tile: 0, dx: -.55, dy: -.35, me: 1, hop: 0, x: 0, y: 0 };
  foe = { tile: 0, dx: .55, dy: .35, me: 0, hop: 0, x: 0, y: 0 };
  turn = 'me'; gameOver = false; busy = false;
  show('game'); layout(); posPiece(me); posPiece(foe); drawItems(); updStars(); checkOrient();
  $('stgChip').textContent = STAGES[i].emoji + ' ' + STAGES[i].name;
  audioInit(); musicStart();
  msg('준비… 출발!');
  const myGen = gen;
  setTimeout(() => { if (myGen !== gen) return; say(STAGES[i].name + ' 대결 시작!'); loop(myGen); }, 900);
}
function drawCards() {
  $('mapStars').textContent = '⭐ ' + SAVE.stars;
  $('cards').innerHTML = STAGES.map((s, i) => {
    const lock = i + 1 > SAVE.un;
    return '<button class="wcard' + (lock ? ' lock' : '') + '" data-i="' + i + '"' + (lock ? ' disabled' : '') + '>' +
      '<div class="em">' + (lock ? '🔒' : s.emoji) + '</div><div class="nm jua">' + s.name + '</div>' +
      '<div class="sb">' + s.sub + '</div><div class="cr">' + (SAVE.win[i] ? '👑' : '') + '</div></button>';
  }).join('');
  [...$('cards').children].forEach(b => b.onclick = () => { SFX.tap(); startStage(+b.dataset.i); });
}
/* 버튼 */
$('startBtn').onclick = () => { audioInit(); SFX.tap(); show('map'); };
$('mapBack').onclick = () => { SFX.tap(); show('title'); };
$('homeBtn').onclick = () => { if (confirm('지도로 돌아갈까요?')) { gen++; gameOver = true; quizOpen = false; speechSynthesis.cancel(); $('quiz').classList.remove('on'); show('map'); } };
$('againBtn').onclick = () => { SFX.tap(); $('res').classList.remove('on'); startStage(si); };
$('toMapBtn').onclick = () => { SFX.tap(); gen++; gameOver = true; $('res').classList.remove('on'); show('map'); };
$('qSpeak').onclick = () => { if (curQ) say(curQ.say); };
function sndToggle() {
  soundOn = !soundOn; const t = soundOn ? '🔊' : '🔇';
  $('sndBtn').textContent = t; $('sndBtn2').textContent = t;
  if (!soundOn) speechSynthesis.cancel();
}
$('sndBtn').onclick = sndToggle; $('sndBtn2').onclick = sndToggle;
$('heroMe').innerHTML = '<img src="' + FACE.src + '" alt="진표">';
document.addEventListener('pointerdown', () => audioInit(), { once: true });
layout(); frame();
</script></body></html>
